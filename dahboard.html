<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
    }

    /* Banner */
    .banner {
      width: 100%;
      height: 300px;
      background: url('https://images.pexels.com/photos/36730407/pexels-photo-36730407.jpeg') no-repeat center center;
      background-size: cover;
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 20px;
    }

    .banner::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
    }

    /* Mech Name button */
    .mech-btn {
      position: relative;
      z-index: 2;
      background: #28a745;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background 0.3s;
    }

    .mech-btn:hover {
      background: #218838;
    }

    /* Cart option */
    .cart-container {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ff69b4;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .cart-container:hover {
      transform: scale(1.05);
    }

    .cart-container img {
      width: 24px;
      height: 24px;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.3);
    }

    .modal-content h3 {
      margin-bottom: 20px;
      color: #333;
    }

    .modal-content input {
      display: block;
      margin: 12px 0;
      padding: 10px;
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
    }

    .modal-content input:focus {
      outline: none;
      border-color: #ff69b4;
      box-shadow: 0 0 5px rgba(255, 105, 180, 0.5);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
    }

    .btn-primary {
      background: #7851a9;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      flex: 1;
      transition: background 0.3s;
    }

    .btn-primary:hover {
      background: #5a3d82;
    }

    .btn-close {
      background: #dc3545;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      flex: 1;
      transition: background 0.3s;
    }

    .btn-close:hover {
      background: #c82333;
    }

    /* Product Section */
    .product-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      justify-content: center;
      margin: 40px;
      gap: 30px;
    }

    .product-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
      text-align: center;
      padding: 15px;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s, box-shadow 0.3s;
      background: linear-gradient(135deg, #ffe6f0 0%, #fff5fa 100%);
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.15);
    }

    .product-card img {
      width: 100%;
      height: 160px;
      object-fit: contain;
      border-radius: 8px;
      background-color: white;
      margin-bottom: 10px;
    }

    .product-card h3 {
      margin: 8px 0;
      color: #7851a9;
      font-size: 18px;
      font-weight: 600;
    }

    .price {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin: 5px 0;
    }

    .discount {
      color: #28a745;
      font-weight: bold;
      font-size: 14px;
    }

    .stock-info {
      display: none;
      margin: 10px 0;
      font-size: 13px;
    }

    .stock-count {
      color: #0066cc;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      font-weight: bold;
      margin-top: 5px;
      padding: 5px;
      border-radius: 3px;
    }

    .status.out-of-stock {
      color: white;
      background: #dc3545;
    }

    .status.on-way {
      color: white;
      background: #fd7e14;
    }

    .status.going-to-ship {
      color: white;
      background: #0066cc;
    }

    .status.shipped {
      color: white;
      background: #28a745;
    }

    .buy-btn {
      margin-top: 12px;
      padding: 10px;
      background-color: #7851a9;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.3s;
      width: 100%;
    }

    .buy-btn:hover {
      background-color: #5a3d82;
    }

    .buy-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    /* User Info */
    .user-info {
      text-align: center;
      padding: 15px;
      background: #f0f0f0;
      margin: 20px 40px 0;
      border-radius: 5px;
      display: none;
    }

    .user-info.active {
      display: block;
    }

    .logout-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 10px;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #c82333;
    }

    .project-logout-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background: #dc3545;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .project-logout-btn:hover {
      background: #c82333;
    }

    /* Cart Modal */
    .cart-modal-content {
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      margin: 10px 0;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-price {
      font-weight: bold;
      color: #7851a9;
    }

    .remove-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
    }

    .total-price {
      font-size: 18px;
      font-weight: bold;
      text-align: right;
      padding: 20px;
      border-top: 2px solid #ddd;
      color: #7851a9;
    }

    .checkout-btn {
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      margin-top: 10px;
    }

    .checkout-btn:hover {
      background: #218838;
    }

    .empty-cart {
      text-align: center;
      padding: 30px;
      color: #999;
    }

    @media (max-width: 768px) {
      .product-container {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        margin: 20px;
        gap: 15px;
      }

      .banner {
        height: 200px;
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Banner -->
  <div class="banner">
    <button class="mech-btn" onclick="openLogin()">Mech</button>
    <div class="cart-container" onclick="openCart()">
      <img src="https://cdn-icons-png.flaticon.com/512/891/891462.png" alt="Cart Icon">
      <span>Cart (<span id="cartCount">0</span>)</span>
    </div>
  </div>

  <!-- User Info -->
  <div class="user-info" id="userInfo">
    <span id="userDisplay"></span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <button class="project-logout-btn" onclick="logoutToProject()">logout</button>

  <!-- Login Modal -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h3>Employee Login</h3>
      <input type="text" id="empName" placeholder="Employee Name">
      <input type="text" id="empId" placeholder="Employee ID">
      <input type="password" id="empPassword" placeholder="Password">
      <div class="btn-group">
        <button class="btn-primary" onclick="login()">Login</button>
        <button class="btn-close" onclick="closeLogin()">Close</button>
      </div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="modal" id="cartModal">
    <div class="modal-content cart-modal-content">
      <h3>Shopping Cart</h3>
      <div id="cartItems"></div>
      <div class="total-price">Total: ₹<span id="totalPrice">0</span></div>
      <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
      <div class="btn-group" style="margin-top: 10px;">
        <button class="btn-close" onclick="closeCart()">Close</button>
      </div>
    </div>
  </div>

  <!-- Product Section -->
  <div class="product-container" id="productContainer"></div>

  <script>
    // Product Database
    const products = [
      { id: 1, name: "Makeup Pack", price: 3400, discount: 50, stock: 17, shippingStatus: "Already shipped", image: "https://www.dermablogger.com/images/posts/10-must-have-cosmetics-for-every-woman-s-beauty-routine-md.jpg" },
      { id: 2, name: "Dress", price: 400, discount: 40, stock: 6, shippingStatus: "On its way", image: "https://i.pinimg.com/originals/99/dc/61/99dc61b035b5596ee7af93c6c8465616.jpg" },
      { id: 3, name: "Women Suit", price: 290, discount: 30, stock: 24, shippingStatus: "Already shipped", image: "https://i.pinimg.com/originals/65/f5/26/65f52629be77028d1b4c5a98684cdceb.png" },
      { id: 4, name: "Coat", price: 1000, discount: 20, stock: 4, shippingStatus: "On its way", image: "https://i5.walmartimages.com/seo/Pea-Coats-for-Women-Womens-Fashion-Winter-Long-Trench-Coat-Jackets-Notch-Collar-Open-Front-Cardigans-Outwear_f05efe24-9afc-4605-884c-c50d934202a7.08846bd58f794e9506bdfef63a55b763.jpeg" },
      { id: 5, name: "Women Shoes", price: 375, discount: 20, stock: 32, shippingStatus: "Delay in shipping", image: "https://m.media-amazon.com/images/I/71IhuPi7iTL._AC_SL1500_.jpg" },
      { id: 6, name: "Women Heels", price: 5000, discount: 20, stock: 12, shippingStatus: "On its way", image: "https://tse3.mm.bing.net/th/id/OIP.6WubmIz0gUgb8aURM3ArsAHaHa?r=0&pid=ImgDet&w=474&h=474&rs=1&o=7&rm=3" },
      { id: 7, name: "Watch", price: 2500, discount: 20, stock: 8, shippingStatus: "Already shipped", image: "https://i.etsystatic.com/25605644/r/il/288464/4127036743/il_1588xN.4127036743_s68w.jpg" },
      { id: 8, name: "Bracelet", price: 1800, discount: 20, stock: 20, shippingStatus: "Delay in shipping", image: "https://www.besttohave.com/images/adjustable-women-s-bracelet-925-sterling-silver-with-created-diamond-p550-4145_zoom.jpg" },
      { id: 9, name: "Flora Dress", price: 2999, discount: 20, stock: 15, shippingStatus: "Already shipped", image: "https://i.pinimg.com/originals/7c/05/25/7c052579112694f094b19529a2c92b28.jpg" }
    ];

    // Global state
    let isLoggedIn = false;
    let currentUser = null;
    let cart = [];

    // Initialize products on page load
    document.addEventListener('DOMContentLoaded', renderProducts);

    function renderProducts() {
      const container = document.getElementById('productContainer');
      container.innerHTML = products.map(product => {
        const discountedPrice = Math.round(product.price * (1 - product.discount / 100));
        return `
          <div class="product-card">
            <img src="${product.image}" alt="${product.name}">
            <h3>${product.name}</h3>
            <div class="price">₹${discountedPrice} <s style="color: #999; font-size: 12px;">₹${product.price}</s></div>
            <div class="discount">${product.discount}% OFF</div>
            <div class="stock-info" id="stockInfo${product.id}">
              <div class="stock-count">Stock: <span id="stock${product.id}">${product.stock}</span></div>
              <div class="status" id="status${product.id}"></div>
            </div>
            <button class="buy-btn" onclick="addToCart(${product.id})" id="buyBtn${product.id}">Buy</button>
          </div>
        `;
      }).join('');
    }

    function openLogin() {
      document.getElementById("loginModal").classList.add("active");
    }

    function closeLogin() {
      document.getElementById("loginModal").classList.remove("active");
      document.getElementById("empName").value = '';
      document.getElementById("empId").value = '';
      document.getElementById("empPassword").value = '';
    }

    function login() {
      const empName = document.getElementById("empName").value.trim();
      const empId = document.getElementById("empId").value.trim();
      const empPassword = document.getElementById("empPassword").value.trim();

      if (empName && empId && empPassword) {
        isLoggedIn = true;
        currentUser = { name: empName, id: empId };

        // Show stock info and update statuses
        products.forEach(product => {
          document.getElementById(`stockInfo${product.id}`).style.display = "block";
          updateStatus(product.id);
        });

        // Update user info display
        document.getElementById("userDisplay").textContent = `Welcome, ${empName} (ID: ${empId})`;
        document.getElementById("userInfo").classList.add("active");

        closeLogin();
      } else {
        alert("Please enter Employee Name, ID, and Password.");
      }
    }

    function logout() {
      isLoggedIn = false;
      currentUser = null;

      // Keep cart items after logout; cart does not require Mech login.

      // Hide stock info
      products.forEach(product => {
        document.getElementById(`stockInfo${product.id}`).style.display = "none";
      });

      document.getElementById("userInfo").classList.remove("active");
    }

    function updateStatus(productId) {
      const product = products.find(p => p.id === productId);
      const statusEl = document.getElementById(`status${productId}`);

      statusEl.className = "status";
      statusEl.textContent = product.shippingStatus;

      if (product.shippingStatus === "Delay in shipping") {
        statusEl.classList.add("on-way");
      } else if (product.shippingStatus === "On its way") {
        statusEl.classList.add("going-to-ship");
      } else {
        statusEl.classList.add("shipped");
      }
    }

    function addToCart(productId) {
      // Login is NOT required to add products to the cart.
      const product = products.find(p => p.id === productId);

      if (product.stock <= 0) {
        alert("This product is out of stock.");
        return;
      }

      const existingItem = cart.find(item => item.id === productId);

      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({
          id: productId,
          name: product.name,
          price: Math.round(product.price * (1 - product.discount / 100)),
          quantity: 1
        });
      }

      updateCartCount();
      alert(`${product.name} added to cart!`);
    }

    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById("cartCount").textContent = count;
    }

    function openCart() {
      renderCartItems();
      document.getElementById("cartModal").classList.add("active");
    }

    function closeCart() {
      document.getElementById("cartModal").classList.remove("active");
    }

    function renderCartItems() {
      const cartItemsDiv = document.getElementById("cartItems");

      if (cart.length === 0) {
        cartItemsDiv.innerHTML = '<div class="empty-cart">Your cart is empty.</div>';
        document.getElementById("totalPrice").textContent = "0";
        return;
      }

      cartItemsDiv.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-details">
            <div><strong>${item.name}</strong></div>
            <div>Qty: ${item.quantity} × ₹${item.price}</div>
          </div>
          <div class="cart-item-price">₹${item.price * item.quantity}</div>
          <button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      document.getElementById("totalPrice").textContent = total;
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      updateCartCount();
      renderCartItems();
    }

    function logoutToProject() {
      // Clear employee login state but keep the shopping cart.
      isLoggedIn = false;
      currentUser = null;

      window.location.href = "project.html";
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
      }

      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      alert(`Processing payment of ₹${total}...\n\nThank you for your purchase!`);
      
      cart = [];
      updateCartCount();
      closeCart();
    }
  </script>

</body>
</html>
