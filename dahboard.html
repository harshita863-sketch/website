<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Commerce</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
}

.banner{
    position:relative;
}

.banner img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.logout{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 18px;
    background:#dc3545;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.products{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
    padding:40px;
}

.card{
    width:30%;
    background:#f8d7e3;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px gray;
    padding:20px;
}

.card img{
    width:170px;
    height:200px;
    object-fit:contain;
    background:white;
    border-radius:10px;
}

.card h3{
    margin:10px;
    color:#7851a9;
}
.price{
    color:#333;
    font-size:22px;
    font-weight:bold;
    margin:10px;
}
.card p{
    margin:6px;
}
.buy-button{
    padding:10px 25px;
    background:#7851a9;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
}
.buy-button:hover{
    background:#5e3d85;
}

</style>
</head>
<body>
<div class="banner">
<img src="https://images.pexels.com/photos/36730407/pexels-photo-36730407.jpeg" alt="Banner">
<button class="logout" onclick="window.location.href='login.html'">Logout</button>
</div>

<div class="products">

<div class="card">
<img src="https://www.dermablogger.com/images/posts/10-must-have-cosmetics-for-every-woman-s-beauty-routine-md.jpg" alt="Makeup Pack">
<h3>Makeup Pack</h3>
<p class="price">₹1700</p>
<p>50% OFF</p>
<button class="buy-button">Buy</button>
</div>

<div class="card">
<img src="https://i.pinimg.com/originals/99/dc/61/99dc61b035b5596ee7af93c6c8465616.jpg" alt="Dress">
<h3>Dress</h3>
<p class="price">₹240</p>
<p>40% OFF</p>
<button class="buy-button">Buy</button>
</div>

<div class="card">
<img src="https://i.pinimg.com/originals/65/f5/26/65f52629be77028d1b4c5a98684cdceb.png" alt="Women Suit">
<h3>Women Suit</h3>
<p class="price">₹203</p>
<p>30% OFF</p>
<button class="buy-button">Buy</button>
</div>

<div class="card">
<img src="https://i5.walmartimages.com/seo/Pea-Coats-for-Women-Womens-Fashion-Winter-Long-Trench-Coat-Jackets-Notch-Collar-Open-Front-Cardigans-Outwear_f05efe24-9afc-4605-884c-c50d934202a7.08846bd58f794e9506bdfef63a55b763.jpeg" alt="Coat">
<h3>Coat</h3>
<p class="price">₹800</p>
<p>20% OFF</p>
<button class="buy-button">Buy</button>
</div>

<div class="card">
<img src="https://m.media-amazon.com/images/I/71IhuPi7iTL._AC_SL1500_.jpg" alt="Women Shoes">
<h3>Women Shoes</h3>
<p class="price">₹300</p>
<p>20% OFF</p>
<button class="buy-button">Buy</button>
</div>

<div class="card">
<img src="https://tse3.mm.bing.net/th/id/OIP.6WubmIz0gUgb8aURM3ArsAHaHa?r=0&pid=ImgDet&w=474&h=474&rs=1&o=7&rm=3" alt="Women Heels">
<h3>Women Heels</h3>
<p class="price">₹4000</p>
<p>20% OFF</p>
<button class="buy-button">Buy</button>
</div>

<div class="card">
<img src="https://i.etsystatic.com/25605644/r/il/288464/4127036743/il_1588xN.4127036743_s68w.jpg" alt="Watch">
<h3>Watch</h3>
<p class="price">₹2000</p>
<p>20% OFF</p>
<button class="buy-button">Buy</button>
</div>

<div class="card">
<img src="https://www.besttohave.com/images/adjustable-women-s-bracelet-925-sterling-silver-with-created-diamond-p550-4145_zoom.jpg" alt="Bracelet">
<h3>Bracelet</h3>
<p class="price">₹1440</p>
<p>20% OFF</p>
<button class="buy-button">Buy</button>
</div>

<div class="card">
<img src="https://i.pinimg.com/originals/7c/05/25/7c052579112694f094b19529a2c92b28.jpg" alt="Flora Dress">
<h3>Flora Dress</h3>
<p class="price">₹2399</p>
<p>20% OFF</p>
<button class="buy-button">Buy</button>
</div>

</div>

</body>
</html>
